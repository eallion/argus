<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="argus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="argus-pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0b0f19"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#argus-grad)" stroke-width="2.2"/>
  <!-- Middle radar ring -->
  <circle cx="16" cy="16" r="6.8" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.85"/>
  <!-- Center eye core -->
  <circle cx="16" cy="16" r="3" fill="url(#argus-pupil)"/>
</svg>
